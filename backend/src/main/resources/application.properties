spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/codeowl}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Select either `openai` (default) or `google-genai` (Gemini Developer API).
# Keep chat and embeddings on the same provider: repository vectors are provider-specific.
spring.ai.model.chat=${AI_PROVIDER:openai}
spring.ai.model.embedding=${AI_PROVIDER:openai}
spring.ai.model.embedding.text=${AI_PROVIDER:openai}

spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.model=gpt-40-mini
spring.ai.openai.embedding.model=text-embedding-3-small

spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.model=${GEMINI_CHAT_MODEL:gemini-2.5-flash}
# Embedding configuration has its own connection properties in Spring AI 2.x.
# Reuse the Gemini Developer API key; otherwise it falls back to Vertex AI and
# requires a Google Cloud project ID and location.
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.embedding.text.model=${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
# Request a reduced Gemini vector size: pgvector's indexed vector type supports
# at most 2,000 dimensions.
spring.ai.google.genai.embedding.text.dimensions=${AI_EMBEDDING_DIMENSIONS:768}
# Set this to the dimension count for the selected embedding provider.
# OpenAI text-embedding-3-small uses 1536; Gemini is requested at 768 here.
spring.ai.vectorstore.pgvector.dimensions=${AI_EMBEDDING_DIMENSIONS:1536}
# Spring AI 2.0 does not create the pgvector table unless this is enabled.
spring.ai.vectorstore.pgvector.initialize-schema=true

spring.security.oauth2.client.provider.github.user-name-attribute=id
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:}
spring.security.oauth2.client.registration.github.scope=read:user,repo


server.servlet.session.cookie.name=CODEOWL_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.max-age=7d


# APP Settings

app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.token-encryptor-password=${TOKEN_ENCRYPTOR_PASSWORD:}
app.token-encryptor-salt=${TOKEN_ENCRYPTOR_SALT:}
app.indexing.max-file-bytes=${INDEXING_MAX_FILE_BYTES:102400}
app.indexing.chunk-size=${INDEXING_CHUNK_SIZE:800}
app.indexing.chunk-overlap=${INDEXING_CHUNK_OVERLAP:100}
app.github.api-delay-ms=${GITHUB_API_DELAY_MS:1000}
